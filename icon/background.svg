<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#f1f5f9" />
      <stop offset="75%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Glow Filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" result="blur" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.08" />
      <circle cx="48" cy="0" r="1.5" fill="#6366f1" fill-opacity="0.15" />
    </pattern>

    <!-- Dot Matrix Pattern -->
    <pattern id="dotMatrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#4f46e5" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="350" fill="url(#glowGrad1)" filter="url(#softGlow)" />
  <circle cx="1700" cy="250" r="400" fill="url(#glowGrad2)" filter="url(#softGlow)" />
  <circle cx="1000" cy="900" r="500" fill="url(#glowGrad3)" filter="url(#softGlow)" />
  <circle cx="300" cy="850" r="380" fill="url(#glowGrad2)" filter="url(#softGlow)" />

  <!-- Tech Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#techGrid)" opacity="0.85" />
  <rect x="1200" y="50" width="600" height="400" fill="url(#dotMatrix)" opacity="0.6" />
  <rect x="100" y="650" width="500" height="350" fill="url(#dotMatrix)" opacity="0.5" />

  <!-- Flowing Data Wave Ribbons -->
  <path d="M -100 480 C 350 250, 750 680, 1200 420 C 1550 210, 1850 350, 2100 280 L 2100 1200 L -100 1200 Z" 
        fill="url(#waveGrad1)" />
  
  <path d="M -100 560 C 400 380, 800 750, 1300 480 C 1650 280, 1880 420, 2100 360 L 2100 1200 L -100 1200 Z" 
        fill="url(#waveGrad2)" />

  <path d="M -100 450 Q 500 150 1100 460 T 2100 240" 
        fill="none" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="8 6" />

  <path d="M -100 520 Q 600 280 1250 510 T 2100 310" 
        fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.3" />

  <path d="M -100 400 Q 400 620 1050 360 T 2100 480" 
        fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Neural Constellation Network (Data Points & Connections) -->
  <g id="neuralNetwork">
    <!-- Connecting Links -->
    <line x1="220" y1="210" x2="380" y2="160" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="380" y1="160" x2="520" y2="280" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="220" y1="210" x2="310" y2="340" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.25" />
    <line x1="310" y1="340" x2="520" y2="280" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.25" />
    <line x1="520" y1="280" x2="680" y2="220" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="380" y1="160" x2="480" y2="90" stroke="#a855f7" stroke-width="1" stroke-opacity="0.2" />

    <!-- Top Right Constellation -->
    <line x1="1450" y1="140" x2="1600" y2="190" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="1600" y1="190" x2="1750" y2="120" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="1600" y1="190" x2="1550" y2="310" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.25" />
    <line x1="1750" y1="120" x2="1820" y2="240" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.25" />
    <line x1="1550" y1="310" x2="1710" y2="290" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="1710" y1="290" x2="1820" y2="240" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.25" />
    <line x1="1350" y1="230" x2="1450" y2="140" stroke="#a855f7" stroke-width="1" stroke-opacity="0.2" />
    <line x1="1350" y1="230" x2="1550" y2="310" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2" />

    <!-- Bottom Network -->
    <line x1="180" y1="840" x2="320" y2="780" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="320" y1="780" x2="440" y2="890" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="180" y1="840" x2="260" y2="970" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.2" />
    <line x1="260" y1="970" x2="440" y2="890" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.25" />

    <!-- Nodes (Circles with Glow) -->
    <!-- Left Group -->
    <circle cx="220" cy="210" r="5" fill="#6366f1" />
    <circle cx="220" cy="210" r="9" fill="#6366f1" fill-opacity="0.25" filter="url(#nodeGlow)" />
    
    <circle cx="380" cy="160" r="6" fill="#06b6d4" />
    <circle cx="380" cy="160" r="11" fill="#06b6d4" fill-opacity="0.3" filter="url(#nodeGlow)" />

    <circle cx="520" cy="280" r="5" fill="#a855f7" />
    <circle cx="520" cy="280" r="9" fill="#a855f7" fill-opacity="0.25" filter="url(#nodeGlow)" />

    <circle cx="310" cy="340" r="4" fill="#3b82f6" />
    <circle cx="680" cy="220" r="5" fill="#06b6d4" />
    <circle cx="480" cy="90" r="3.5" fill="#818cf8" />

    <!-- Right Group -->
    <circle cx="1450" cy="140" r="5" fill="#6366f1" />
    <circle cx="1600" cy="190" r="7" fill="#06b6d4" />
    <circle cx="1600" cy="190" r="13" fill="#06b6d4" fill-opacity="0.35" filter="url(#nodeGlow)" />

    <circle cx="1750" cy="120" r="5.5" fill="#3b82f6" />
    <circle cx="1550" cy="310" r="6" fill="#a855f7" />
    <circle cx="1550" cy="310" r="11" fill="#a855f7" fill-opacity="0.3" filter="url(#nodeGlow)" />

    <circle cx="1710" cy="290" r="5" fill="#6366f1" />
    <circle cx="1820" cy="240" r="4.5" fill="#06b6d4" />
    <circle cx="1350" cy="230" r="4" fill="#818cf8" />

    <!-- Bottom Group -->
    <circle cx="180" cy="840" r="5" fill="#06b6d4" />
    <circle cx="320" cy="780" r="6" fill="#6366f1" />
    <circle cx="440" cy="890" r="5.5" fill="#a855f7" />
    <circle cx="260" cy="970" r="4" fill="#3b82f6" />
  </g>

  <!-- High-Tech Coordinate / Data Accent Markers -->
  <g font-family="monospace" font-size="11" fill="#6366f1" fill-opacity="0.4" font-weight="600">
    <text x="80" y="120">SYS.DATA_MEDIC // v2.6</text>
    <text x="80" y="140">NODE_STATUS: ONLINE</text>
    <text x="1720" y="80">AI_PIPELINE: ACTIVE</text>
    <text x="1720" y="100">CLEANING_ENGINE // READY</text>
  </g>

  <!-- Modern Corner Crosshairs -->
  <g stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3">
    <path d="M 40 40 L 60 40 M 40 40 L 40 60" />
    <path d="M 1880 40 L 1860 40 M 1880 40 L 1880 60" />
    <path d="M 40 1040 L 60 1040 M 40 1040 L 40 1020" />
    <path d="M 1880 1040 L 1860 1040 M 1880 1040 L 1880 1020" />
  </g>
</svg>
